name: Build and Deploy Sage WASM Demo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static WASM bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout demo repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Rust and wasm build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock', '**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-v0.13
          restore-keys: |
            ${{ runner.os }}-wasm-pack-

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack

      - name: Build WASM output
        run: wasm-pack build --release --target web --out-dir pkg

      - name: Create static site artifact
        run: |
          mkdir -p dist
          cp -r index.html app.js styles.css demo_data.json mini.fasta PXD003881.json pkg dist/
          if [ -f PXD003881.fasta ]; then
            cp PXD003881.fasta dist/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
