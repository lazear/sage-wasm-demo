[package]
name = "sage-wasm-demo"
version = "0.1.0"
description = "Static web demo embedding sage-core in WASM"
authors = ["Codex"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sage-core = { package = "sage-core", git = "https://github.com/lazear/sage.git", tag = "v0.15.0-beta.2" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
